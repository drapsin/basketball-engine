<div class="register-container">
  <h2>Register as Manager</h2>
  <p class="hint">Your account will need approval from an administrator before you can log in.</p>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <label>
      Email
      <input type="email" formControlName="email" />
      @if (registerForm.controls.email.invalid && registerForm.controls.email.touched) {
        <span class="field-error">Please enter a valid email.</span>
      }
    </label>

    <label>
      Password
      <input type="password" formControlName="password" />
      @if (registerForm.controls.password.invalid && registerForm.controls.password.touched) {
        <span class="field-error">Password must be at least 6 characters.</span>
      }
    </label>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    @if (successMessage()) {
      <p class="success">{{ successMessage() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Submitting...' : 'Register' }}
    </button>
  </form>
</div>
